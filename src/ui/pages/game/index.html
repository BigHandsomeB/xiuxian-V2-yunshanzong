<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172d32"><script src="{{ url_for('static', filename='theme-bootstrap.js') }}"></script><title>云山宗 · 修仙宗门</title><link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}"><script type="module" src="{{ url_for('static', filename='game.js') }}"></script>{% if review %}<link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">{% endif %}</head>
<body data-ui-review="{{ 'true' if review else 'false' }}">
{% if review %}<aside class="review-banner"><strong>只读UI预览 · 演示数据</strong><a href="{{ url_for('guide') }}">评审目录</a><a href="{{ url_for('preview') }}?case=normal#battle">普通</a><a href="{{ url_for('preview') }}?case=elite#battle">精英</a><a href="{{ url_for('preview') }}?case=boss#battle">Boss</a><a href="{{ url_for('preview') }}?case=production#building/alchemy">生产</a></aside>{% endif %}
<div class="game-shell">
<header class="game-top"><div class="sect-seal" aria-hidden="true">山</div><a class="game-name" href="#sect">云山宗</a><div id="world-bar" class="world-bar"><span id="world-status" role="status" aria-live="polite">正在连接…</span><button id="world-toggle" class="world-toggle" aria-label="暂停世界" title="暂停世界" disabled>Ⅱ</button></div><button id="refresh" class="icon-button" aria-label="更新游戏状态" hidden>↻</button><a href="#settings" class="icon-button" aria-label="设置与帮助">☰</a></header>
<p id="world-paused-notice" class="world-paused-notice" role="status" hidden>世界已暂停：战斗与生产不推进；买卖、升级、打造等操作可用</p>
<div id="connection" class="connection" role="status" aria-live="polite" hidden></div>
<main id="screen" tabindex="-1" aria-busy="true"><div class="loading-state" role="status">正在推开山门…</div></main>
<nav id="main-nav" class="bottom-nav" aria-label="游戏主导航"><a href="#sect" data-tab="sect"><span aria-hidden="true">山</span>宗门</a><a href="#disciples" data-tab="disciples"><span aria-hidden="true">人</span>弟子</a><a href="#cultivation" data-tab="cultivation"><span aria-hidden="true">道</span>修炼</a><a href="#inventory" data-tab="inventory"><span aria-hidden="true">匣</span>仓库</a><a href="#adventure" data-tab="adventure"><span aria-hidden="true">剑</span>冒险</a></nav>
</div>
<dialog id="sheet" class="bottom-sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="关闭详情">×</button></header><div id="sheet-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
