name: Publish v0.2.0 once
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v020-once.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'BigHandsomeB/xiuxian-V2-yunshanzong'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish the audited v0.2.0 snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository = "BigHandsomeB/xiuxian-V2-yunshanzong"
          assert os.environ["GITHUB_REPOSITORY"] == repository
          payload = {
              "tag_name": "v0.2.0",
              "target_commitish": "1a374d61c07d6dfb90aa25d7c7f04a0afb4e3e32",
              "name": "v0.2.0 · 离火丹墟与功法流派更新",
              "body": "# v0.2.0 · 离火丹墟与功法流派更新\n\n本次版本新增第五副本，更新前五副本装备属性和150部功法特殊机制，并接入完整的对应特效反馈。\n\n## 新增与更新\n\n- **离火丹墟**：100层、10只普通怪、5只精英与离火丹魔；12件装备、12种专属材料与4种主题材料。通关寒玉冰窟100层后解锁。\n- **前五副本装备**：60件装备的属性方向和特色机制；新掉落采用新范围，已保存的旧装备不重抽属性。\n- **150部功法**：数据化触发、状态、护盾、治疗、持续伤害、控制、资源、冷却与次数限制；绝技和终极按条件自动施放，八功法槽保留。\n- **战斗特效**：13个新特效/42帧，复用8个旧特效，补齐灵气爆破播放；按真实元素和状态选择反馈，保持并发上限与后台暂停。\n- **近期体验与工具**：功法槽原地装备/更换/卸下、设置页入口整理；素材工具改进特效分帧与发布后的原图清理。正式游戏只依赖批准Runtime，无需素材管理器常驻。\n\n## 下载与存档\n\n下载本页的 **Source code (zip)**，按[README](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong#本地运行)启动。首次运行`tools.playable.setup_local`创建当前完整内容的新档；已有存档不要再次初始化。\n\nv0.1.0存档需先停止自己的游戏服务，再按[升级说明](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.2.0/docs/project/UPGRADE-v0.2.0.md)备份并执行显式内容升级。升级保留旧装备、进度和原战斗；原战斗按旧快照继续，后续新战斗启用新机制。新版本产生内容后，回退必须恢复升级前完整备份。\n\n## 验证与边界\n\n发布副本验证新档、登录、只读视图、旧档升级与相关规则；原生JS检查事件路由、缓存上限和后台清理。具体结果见[发布说明](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.2.0/docs/project/RELEASE.md)。不把代码/DOM检查当作手机绘制验收。\n\n当前开放炼气、筑基与前五副本。后五副本、后续境界、独立功法修炼及多人独立存档仍未开放。手机视觉、长期挂机与各流派平衡继续验证；当前样本中护盾流对第五Boss更有优势。\n\n没有在游戏服务器生成压缩包；下载包由GitHub生成。仓库不含作者真实存档、口令、制作数据库、原图和切片。\n",
              "draft": False,
              "prerelease": False,
              "make_latest": "true"
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repository + "/releases",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "yunshanzong-one-time-release"
              }, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201
              release = json.load(response)
              assert release["tag_name"] == "v0.2.0"
              print(release["html_url"])
          PY
