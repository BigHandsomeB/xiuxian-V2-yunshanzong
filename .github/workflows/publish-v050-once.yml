21\\u732e\\uff0c\\u663e\\u793a\\u52a0\\u6210\\u9884\\u89c8\\u4e0e\\u7cbe\\u70bc\\u88c5\\u5907\\u5149\\u6655\\u3002\\n- \\u5f1f\\u5b50\\u5c45\\u5148\\u663e\\u793a\\u5404\\u5efa\\u7b51\\u4eba\\u6570\\uff0c\\u518d\\u8fdb\\u5165\\u914d\\u65b9\\u884c\\uff0c\\u7528\\u53f3\\u4fa7\\u52a0\\u51cf\\u6309\\u94ae\\u6bcf\\u6b21\\u8c03\\u6574 1 \\u4eba\\u3002\\u4e0d\\u540c\\u914d\\u65b9\\u72ec\\u7acb\\u5b89\\u6392\\uff1b\\u672c\\u8f6e\\u5fd9\\u788c\\u5f1f\\u5b50\\u51cf\\u5458\\u540e\\u7b49\\u5f85\\u6279\\u6b21\\u7ed3\\u675f\\u91ca\\u653e\\u3002\\u540c\\u4e00\\u5efa\\u7b51\\u4ecd\\u6309\\u539f\\u5355\\u6279\\u6b21\\u8f6e\\u6362\\u751f\\u4ea7\\u3002\\n- \\u540c\\u6b65\\u5f53\\u524d\\u5df2\\u5b9e\\u73b0\\u7684\\u5b9a\\u5411\\u5c5e\\u6027\\u8bd5\\u70bc\\u573a\\u53ca\\u76f8\\u5173\\u754c\\u9762\\u6539\\u8fdb\\u3002\\u65e7\\u6218\\u6597\\u7f3a\\u88c5\\u5907\\u5feb\\u7167\\u65f6\\u589e\\u52a0\\u4e0d\\u53ef\\u80fd\\u7ec4\\u5408\\u526a\\u679d\\uff0c\\u4fdd\\u6301\\u6821\\u9a8c\\u89c4\\u5219\\uff0c\\u6539\\u5584\\u51b7\\u542f\\u52a8\\u8017\\u65f6\\u3002\\n\\n## \\u4e0b\\u8f7d\\u4e0e\\u8fd0\\u884c\\n\\n\\u4e0b\\u8f7d\\u672c\\u9875 Source code (zip) \\u6216 Source code (tar.gz)\\uff0c\\u6309 [README](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.5.0/README.md#\\u672c\\u5730\\u8fd0\\u884c) \\u542f\\u52a8\\u3002\\u6e90\\u7801\\u5305\\u7531 GitHub \\u751f\\u6210\\u3002Windows EXE \\u4e0d\\u901a\\u8fc7\\u672c\\u6b21\\u7f51\\u9875\\u6e90\\u7801\\u5305\\u5347\\u7ea7\\u3002\\n\\n## \\u65e7\\u6863\\u5347\\u7ea7\\n\\nv0.4.0 \\u7f51\\u9875\\uff0f\\u670d\\u52a1\\u5668\\u7248\\uff1a\\u5148\\u505c\\u6b62\\u81ea\\u5df1\\u7684\\u8fdb\\u7a0b\\uff0c\\u5b8c\\u6574\\u5907\\u4efd `.game` \\u4e0e\\u73af\\u5883\\u914d\\u7f6e\\uff1b\\u66ff\\u6362\\u6e90\\u7801\\u548c\\u6b63\\u5f0f Runtime \\u540e\\uff0c\\u4f7f\\u7528\\u539f\\u5b58\\u6863\\u4e0e\\u539f\\u53e3\\u4ee4\\u542f\\u52a8\\u3002\\u6cbf\\u7528\\u540c\\u4e00\\u5185\\u5bb9\\u7248\\u672c\\uff0c\\u65b0\\u5b57\\u6bb5\\u517c\\u5bb9\\u7f3a\\u7701\\u65e7\\u6863\\uff1b\\u4e0d\\u8981\\u91cd\\u65b0\\u521d\\u59cb\\u5316\\uff0c\\u4e0d\\u91cd\\u62bd\\u88c5\\u5907\\u3002\\u5360\\u683c\\u89c4\\u5219\\u6309\\u5f53\\u524d\\u54c1\\u79cd\\u914d\\u7f6e\\u8ba1\\u7b97\\uff0c\\u65e7\\u5b58\\u680f\\u65e0\\u9700\\u8fc1\\u79fb\\u6216\\u91cd\\u8d2d\\u3002\\u65b0\\u7cbe\\u70bc\\uff0f\\u914d\\u65b9\\u5b57\\u6bb5\\u4e00\\u65e6\\u5199\\u5165\\uff0c\\u56de\\u9000\\u5e94\\u540c\\u65f6\\u6062\\u590d\\u65e7\\u4ee3\\u7801\\u548c\\u66f4\\u65b0\\u524d\\u6574\\u4efd\\u5b58\\u6863\\u5907\\u4efd\\u3002\\n\\n\\u66f4\\u65e7\\u7248\\u672c\\u5148\\u6309 [\\u65e2\\u6709\\u5347\\u7ea7\\u8bf4\\u660e](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.5.0/docs/project/UPGRADE-main-artifacts.md) \\u5b8c\\u6210\\u5bf9\\u5e94\\u663e\\u5f0f\\u8fc1\\u79fb\\u3002\\n\\n## \\u9a8c\\u8bc1\\u4e0e\\u8fb9\\u754c\\n\\n\\u9488\\u5bf9\\u5360\\u683c\\u3001\\u672b\\u5c3e\\u53ca\\u76f8\\u90bb\\u683c\\u3001\\u6279\\u91cf\\u65e7\\u5b58\\u680f\\u3001\\u65e7\\u6863\\u7eaf\\u8bfb\\u3001\\u81ea\\u52a8\\u7eed\\u517b\\u4e0e\\u79cd\\u690d\\u4e8b\\u52a1\\u8fd0\\u884c\\u5b9a\\u5411\\u68c0\\u67e5\\uff1b\\u540c\\u6837\\u4eba\\u6570\\u4e0e\\u6750\\u6599\\u7684\\u4e00\\u5c0f\\u65f6\\u7ecf\\u6d4e\\u5bf9\\u7167\\u4fdd\\u6301\\u8d39\\u7528\\u3001\\u4ea7\\u51fa\\u548c\\u5e93\\u5b58\\u51c0\\u53d8\\u4e00\\u81f4\\u3002\\u5360\\u5730\\u51cf\\u5c11\\u53ef\\u4ee5\\u5b89\\u6392\\u66f4\\u591a\\u4e2a\\u4f53\\uff0c\\u5b9e\\u9645\\u4ea7\\u80fd\\u4ecd\\u53d7\\u5f1f\\u5b50\\u3001\\u9972\\u6599\\u3001\\u5468\\u671f\\u4e0e\\u4ed3\\u5bb9\\u9650\\u5236\\u3002\\n\\n\\u516c\\u5f00\\u53d1\\u5e03\\u526f\\u672c96\\u9879Python\\u68c0\\u67e5\\u901a\\u8fc7\\uff0c\\u8986\\u76d6\\u9010\\u683c\\u79cd\\u517b\\uff0fHTTP\\u3001\\u7cbe\\u70bc\\uff0fHTTP\\u3001\\u914d\\u65b9\\u6d3e\\u5de5\\uff0fHTTP\\u3001\\u5386\\u53f2\\u6218\\u6597\\u5feb\\u7167\\u6821\\u9a8c\\u548c\\u516c\\u5f00\\u56fe\\u9274\\u3002\\u65b0\\u6863\\u542f\\u52a8\\u3001\\u8ba4\\u8bc1\\u4fdd\\u62a4\\u3001\\u62d2\\u7edd\\u8986\\u76d6\\u4e0e\\u53ea\\u8bfb\\u6570\\u636e\\u5e93\\u4fdd\\u6301\\u4e5f\\u5df2\\u68c0\\u67e5\\u3002\\u5f00\\u53d1\\u5de5\\u4f5c\\u533a\\u53e6\\u901a\\u8fc744\\u9879\\u79cd\\u517b\\u53ca33\\u9879\\u751f\\u6001\\u68c0\\u67e5\\uff08\\u4e0e\\u53d1\\u5e03\\u526f\\u672c\\u5b58\\u5728\\u91cd\\u53e0\\uff0c\\u4e0d\\u76f8\\u52a0\\uff09\\u3002\\u6ca1\\u6709\\u5ba3\\u79f0\\u5168\\u5957\\u5386\\u53f2\\u56de\\u5f52\\u5168\\u7eff\\u3002320/390/430px \\u6d45\\u6df1\\u4e3b\\u9898\\u7684\\u5b9e\\u9645\\u7ed8\\u5236\\u3001\\u624b\\u673a\\u89e6\\u63a7\\u53ca\\u957f\\u671f\\u7ecf\\u6d4e\\u7ee7\\u7eed\\u4eba\\u5de5\\u9a8c\\u6536\\u3002\\n\\n\\u516c\\u5f00\\u5305\\u5305\\u542b\\u6e90\\u7801\\u3001\\u6b63\\u5f0f Runtime \\u4e0e\\u516c\\u5f00\\u56fe\\u9274\\u540d\\u79f0\\uff1b\\u4e0d\\u542b\\u4f5c\\u8005\\u73a9\\u5bb6\\u5b58\\u6863\\u3001\\u53e3\\u4ee4\\u3001\\u5236\\u4f5c\\u6570\\u636e\\u5e93\\u3001\\u539f\\u56fe\\u3001\\u4e2d\\u95f4\\u7d20\\u6750\\u6216\\u5185\\u90e8\\u4efb\\u52a1\\u5386\\u53f2\\u3002\\n", "draft": false, "prerelease": false, "make_latest": "true"}')
          assert payload['tag_name']=='v0.5.0'
          assert payload['target_commitish']=='249875859fd6bdc85226cafa1943736008751010'
          base='https://api.github.com/repos/'+repository
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'yunshanzong-one-time-release'}
          try:
           with urllib.request.urlopen(urllib.request.Request(base+'/releases/tags/v0.5.0',headers=headers),timeout=30) as response:release=json.load(response)
           assert release['body']==payload['body'] and not release['draft']
          except urllib.error.HTTPError as error:
           if error.code!=404:raise
           request=urllib.request.Request(base+'/releases',data=json.dumps(payload).encode(),headers=headers,method='POST')
           with urllib.request.urlopen(request,timeout=30) as response:
            assert response.status==201
            release=json.load(response)
          assert release['tag_name']=='v0.5.0' and not release['draft'] and not release['prerelease']
          print(release['html_url'])
          PY
