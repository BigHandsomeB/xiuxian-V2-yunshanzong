name: Publish v0.4.0 once
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v040-once.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'BigHandsomeB/xiuxian-V2-yunshanzong'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish audited web-server snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repository = "BigHandsomeB/xiuxian-V2-yunshanzong"
          assert os.environ["GITHUB_REPOSITORY"] == repository
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          payload = json.loads('{"tag_name": "v0.4.0", "target_commitish": "fd420f2b48f70f0e776d4b9749d98493636d0535", "name": "v0.4.0 · 网页／服务器版 · 山外探索与宗门旧事", "body": "# v0.4.0 · 山外探索与宗门旧事\\n\\n运行方式：网页／服务器源码，需要 Python 后端与浏览器。Windows 独立桌面版继续使用自己的分支与 v0.3.0-windows 发行包，本次不替换桌面版。\\n\\n## 新增内容\\n\\n- 冒险探索与特殊事件：四处探索地点、十二项事件，使用真实服务器条件、消耗、时长与奖励。\\n- 主线记录：五章主线及独立筑基记事，共36个节点；支持待阅读、已阅读回看和显式标记。阅读不暂停挂机，也不额外赠送奖励。入口位于冒险顶部“战斗记录”之后。\\n- 万宝楼自动补货：多份材料保有量清单，弟子执行，共用每日行情与限购，支持离线逐日结算。\\n- 进入游戏默认到宗门，新增山门、云海、石阶与青玉云纹加载主视觉；首页图片有最长等待时间和加载失败重试。\\n- 功法阁换为与同组建筑一致的正式图标。设置新增离线战报自动弹出开关，默认开启并保存浏览器选择；四个工具按钮图标固定在左侧。\\n\\n## 下载与运行\\n\\n下载本页的 Source code (zip) 或 Source code (tar.gz)，按 [README](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.4.0/README.md#本地运行) 启动。源码包由 GitHub 生成，不在游戏服务器压缩。\\n\\n## 升级\\n\\n已有 v0.3.0 网页／服务器版：先停止自己的进程并完整备份 `.game`，替换源码和正式Runtime图片后沿用原存档与口令启动；本次沿用同一内容版本和可选旧档字段，不重新初始化，不重抽装备，不发放补偿或物品。回退应同时恢复原代码与升级前整份备份。\\n\\n更旧版本仍按 [既有升级步骤](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.4.0/docs/project/UPGRADE-main-artifacts.md) 先完成对应显式迁移，不要用初始化工具覆盖旧档。Windows EXE 不通过本次网页源码包升级。\\n\\n## 验证与边界\\n\\n独立公开发布副本62项Python检查通过，覆盖剧情、探索、补货、公开图鉴与页面路由；另核对新档启动、拒绝覆盖已有存档、登录保护、36个剧情节点及主视觉PNG。只读查询前后测试数据库摘要一致。前五副本、炼气/筑基、既有法宝与功法沿用原玩法。未开放的后续境界、副本与多人独立存档不因本次发布而开放。\\n\\n320/390/430px浅深主题、实际手机绘制/触摸、长期挂机与全流派高等级平衡继续人工验收。自动DOM及HTTP检查不代表实机通过。\\n\\n公开包仅包含源码、已批准Runtime图片和公开图鉴名称，不包含作者真实存档、口令、制作Catalog、原图、切片和内部任务历史。\\n\\n发布核对：862条正式素材/923个Runtime文件摘要通过；剧情界面128项、冒险入口6项原生JS通过。发行内容树含1483文件。Notion未同步。\\n", "draft": false, "prerelease": false, "make_latest": "true"}')
          assert payload["tag_name"] == "v0.4.0"
          assert payload["target_commitish"] == "fd420f2b48f70f0e776d4b9749d98493636d0535"
          base = "https://api.github.com/repos/" + repository
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "yunshanzong-one-time-release"}
          try:
              with urllib.request.urlopen(urllib.request.Request(base+"/releases/tags/v0.4.0",headers=headers),timeout=30) as response:
                  release=json.load(response)
              assert release["body"] == payload["body"] and not release["draft"]
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              request=urllib.request.Request(base+"/releases",data=json.dumps(payload).encode(),headers=headers,method="POST")
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert response.status == 201
                  release=json.load(response)
          assert release["tag_name"] == "v0.4.0" and not release["draft"] and not release["prerelease"]
          print(release["html_url"])
          PY
