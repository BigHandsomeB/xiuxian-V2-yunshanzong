name: Publish v0.3.0 once
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v030-once.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'BigHandsomeB/xiuxian-V2-yunshanzong'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish the audited v0.3.0 snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repository = "BigHandsomeB/xiuxian-V2-yunshanzong"
          assert os.environ["GITHUB_REPOSITORY"] == repository
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          payload = json.loads("{\"tag_name\":\"v0.3.0\",\"target_commitish\":\"0c7983bcbbde562176136a6c7c7d325b754dca6d\",\"name\":\"v0.3.0 · 法宝与功法秒制冷却\",\"body\":\"# v0.3.0 · 法宝与功法秒制冷却\\n\\n本次版本加入五件可炼制法宝、正式法宝外观、法宝培养，以及功法自动技能的秒制冷却。\\n\\n## 新增与更新\\n\\n- **五件法宝**：斩妖飞剑、镇岳鼎、噬魂幡、寒魄印、赤焰葫；用对应Boss核心、大量材料和2至12小时炼制，在炼器阁集中管理。\\n- **法宝培养**：独立装备槽、投喂怪物材料升级、随击杀获得经验及强化。战斗开始冻结法宝快照，在线和离线沿用同一奖励结算。\\n- **正式外观**：五张128×128透明素材，法宝在主角左上方浮空，由程序驱动动作；法宝页一行两张大图卡片，图片下方显示小字说明。\\n- **功法秒制冷却**：身法10秒、防御12秒、绝技8秒、终极24秒；身法/防御运转6回合，50部内功保持原规则。当前旧战斗继续使用原快照，新规则用于新开的战斗。\\n- **素材管理器**：法宝专用128×128类型，支持先批量导入名称，再按顺序或名称批量补充外观方向；提示词保留冻结的逐件方向。\\n- **扩展接口**：法宝定义、Boss材料来源、配方、成长、效果和程序动作集中登记，便于后续副本接入。\\n\\n## 下载与升级\\n\\n下载本页 **Source code (zip)**，按[README](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.3.0/README.md#本地运行)启动。新玩家初始化即可获得当前内容的新档。\\n\\n已有存档请先停止自己的服务并备份，按[升级步骤](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/v0.3.0/docs/project/UPGRADE-main-artifacts.md)依次执行功法时序和法宝的显式升级。不要重新初始化旧档；旧装备、库存、世界时间、身份和原战斗保留。升级不赠送法宝或材料。回退需恢复升级前整份存档与对应旧代码。\\n\\n## 验证与边界\\n\\n发布副本132项Python检查通过，并核对新档启动、拒绝覆盖、登录保护、五张法宝PNG及只读查询保持。861条正式素材、922个Runtime文件摘要检查通过。\\n\\n手机实际绘制/触摸、长时挂机与高等级全流派平衡继续验收；原生DOM检查不等同于手机验收。当前仍为单实例共用存档、炼气/筑基及前五副本；未开放后续境界、后五副本和多人独立存档。\\n\\n仓库不含作者真实存档、口令、制作数据库、原图或切片。源码压缩包由GitHub生成，不在游戏服务器压缩打包。\\n\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}")
          assert payload["tag_name"] == "v0.3.0"
          assert payload["target_commitish"] == "0c7983bcbbde562176136a6c7c7d325b754dca6d"
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repository + "/releases",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "yunshanzong-one-time-release"
              }, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201
              release = json.load(response)
              assert release["tag_name"] == "v0.3.0" and not release["draft"] and not release["prerelease"]
              print(release["html_url"])
          PY
