name: Publish first playable release (one time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-first-playable.yml"
permissions:
  contents: write
concurrency:
  group: yunshanzong-first-playable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'BigHandsomeB/xiuxian-V2-yunshanzong'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish reviewed snapshot without checkout or packaging
        env:
          RELEASE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "BigHandsomeB/xiuxian-V2-yunshanzong":
              raise SystemExit("This one-time publisher is restricted to the intended repository")
          headers = {"Authorization": "Bearer " + os.environ["RELEASE_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "yunshanzong-one-time-release"}
          base = "https://api.github.com/repos/" + repo
          try:
              with urllib.request.urlopen(urllib.request.Request(base + "/releases/tags/v0.1.0", headers=headers), timeout=30) as response:
                  existing = json.load(response)
              print("Release already exists; no overwrite:", existing["html_url"])
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              payload = json.loads("{\"tag_name\":\"v0.1.0\",\"target_commitish\":\"cbc11c09f77a360dc416e6ce3adfad2151fb1707\",\"name\":\"v0.1.0 · 云山宗 V2 首个可玩版本\",\"body\":\"# 云山宗 V2 · 首个可玩版本\\n\\n手机竖屏修仙宗门经营与单主角自动战斗游戏。此版本固定当前已发布的完整源码、配置、正式素材、实机截图和运行文档。\\n\\n## 已实现\\n- 宗门、弟子、修炼、仓库、冒险五个主要页面，浅色/深色主题。\\n- 宗门建筑、招募、岗位分配、采集、生产、炼丹、打造与强化。\\n- 四建筑生态、灵植、养殖与27种灵膳。\\n- 荆棘古道、赤铜废矿、雾隐灵泽、寒玉冰窟，各100层。\\n- 自动推层与回刷、六槽随机装备、150部正式功法。\\n- 宗门委托、贡献兑换、声望与Boss定向宝箱。\\n- 世界暂停、离线续算、收益报告和存档备份。\\n- README实机截图、本地游玩及HTTPS部署说明；MIT许可证。\\n\\n## 下载与游玩\\n下载本页的 **Source code (zip)**，解压后按README“本地运行”执行。需要Python 3.11+；Linux/macOS或Windows WSL。源码包含游戏需要的正式素材，不是免安装可执行程序。\\n\\n首次运行创建自己的新档；后续启动保留 `.game/`。仓库不含原作者口令、真实存档、素材制作数据库、原图和切片中间文件。无需启动素材管理器即可游玩。\\n\\n[完整运行说明](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong#本地运行) · [在线部署](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong#在线部署) · [后续规划](https://github.com/BigHandsomeB/xiuxian-V2-yunshanzong/blob/main/ROADMAP.md)\\n\\n## 当前边界\\n- 开放炼气、筑基及前四副本；后续境界和后六副本尚未开放。\\n- 同一个后端实例共用一份存档和一个口令，尚无多人账号与独立存档隔离。\\n- 最新功能仍有真实手机与长期数值平衡验收事项；不是成熟多人在线运营版本。\\n\\n## 发布核对\\n发布过程中已核对正式Runtime文件哈希/尺寸、公开图鉴投影、登录和新档流程，并通过相关玩法/存档测试。具体范围见仓库发布说明；没有将代码检查称为全部实机验收。源码压缩包由GitHub自动生成，没有在原服务器重新打包素材。\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}")
              request = urllib.request.Request(base + "/releases", data=json.dumps(payload, ensure_ascii=False).encode(), headers={**headers, "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              print("Published:", result["html_url"])
          
          PY
